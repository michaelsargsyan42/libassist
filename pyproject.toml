[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "libassist"
version = "0.1.0"
description = "Reference AI-agent project: a REST API, an MCP tool server, RAG with citations, a confirmation-gated agent and pass^k evals, in a university-library domain."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mikayel Sargsyan" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "anyio>=4",
    "pydantic>=2.7",
    "mcp>=2.3,<3",
    "pyyaml>=6",
    "bm25s>=0.3"
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
libassist-api = "libassist.api.main:run"
libassist-mcp = "libassist.mcp_server.server:main"
libassist-chat = "libassist.agent.cli:main"
libassist-demo = "libassist.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
libassist = ["db/schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["e2e: starts the HTTP API and an MCP server subprocess (still fast, no LLM needed)"]
filterwarnings = ["ignore::DeprecationWarning:websockets.*", "ignore::DeprecationWarning:uvicorn.*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
